<!doctype html>
<html lang="en" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Header logo animation preview</title>
<style>
	body { margin: 0; padding: 40px; font: 15px/1.5 system-ui, sans-serif; color: #17222e; background: #fff; }
	.row { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; margin-bottom: 40px; }
	.ssx-logo { display: block; }
	.ssx-logo img { display: block; height: auto; }
	.big img { width: 1000px; }
	.desk img { width: 320px; }
	.phone img { width: 240px; }
	.dark { background: #0d2236; padding: 20px; }
	button { font: inherit; padding: 8px 14px; cursor: pointer; }
</style>
</head>
<body>
<p>Local check page for <code>js/logo-motion.js</code> (not linked from the site). Hover a logo to play it again.</p>
<!-- The script animates the first visible logo; add ?size=desk or ?size=phone to check another size. -->
<div class="row big" id="stage">
	<a class="ssx-logo" href="#">
		<img class="header-logo" alt="Storefront Sign Online" width="1910" height="323"
			src="../../img/brand/sfs-logo-1910.webp">
	</a>
</div>
<script>
	(function () {
		var size = (location.search.match(/size=(\w+)/) || [])[1];
		if (size) {
			document.getElementById('stage').className = 'row ' + size;
		}
	}());
</script>
<script>
	// Always the newest copy of the script (the theme folder is cached for a year).
	(function () {
		// ?freeze=off shows the plain picture; ?freeze=600 holds the animation
		// 600 ms in (for screenshots: compare ?freeze=0 with ?freeze=off).
		var freeze = (location.search.match(/freeze=(\w+)/) || [])[1];
		if ('off' === freeze) {
			return;
		}
		var script = document.createElement('script');
		script.src = '../../js/logo-motion.js?t=' + Date.now();
		document.body.appendChild(script);
		if (undefined !== freeze) {
			setTimeout(function () {
				var host = document.querySelector('.ssx-logo');
				host.classList.add('lm-play');
				host.getAnimations({ subtree: true }).forEach(function (animation) {
					animation.pause();
					animation.currentTime = Number(freeze);
				});
				document.title = 'frozen';
			}, 3200);
		}
	}());
</script>
</body>
</html>
